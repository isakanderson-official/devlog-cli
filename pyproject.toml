[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devlog-cli"
dynamic = ["version"]
description = "A minimal, beautiful terminal-based todo app for developers"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Isak Anderson"}]
keywords = ["todo", "cli", "tui", "productivity", "terminal", "developer", "devlog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/isakanderson-official/devlog-cli"
Issues = "https://github.com/isakanderson-official/devlog-cli/issues"
Repository = "https://github.com/isakanderson-official/devlog-cli"

[project.scripts]
devlog = "devlog:run"

[tool.setuptools.packages.find]
include = ["devlog*"]

[tool.setuptools.dynamic]
version = {attr = "devlog.__version__"}
